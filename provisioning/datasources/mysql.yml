apiVersion: 1
datasources:
  - name: SPZ MySQL
    uid: spz-mysql
    type: mysql
    access: proxy
    url: ${SPZ_DB_HOST}
    database: ${SPZ_DB_NAME}
    user: ${SPZ_DB_USER}
    isDefault: true
    editable: false
    secureJsonData:
      password: ${SPZ_DB_PASSWORD}
    jsonData:
      maxOpenConns: 10
      maxIdleConns: 5
      connMaxLifetime: 14400
  - name: SPZ Server Health
    uid: spz-health
    type: mysql
    access: proxy
    url: ${GF_DATABASE_HEALTH_HOST}
    database: ${GF_DATABASE_HEALTH_NAME}
    user: ${GF_DATABASE_HEALTH_USER}
    isDefault: false
    editable: false
    secureJsonData:
      password: ${GF_DATABASE_HEALTH_PASSWORD}
    jsonData:
      maxOpenConns: 5
      maxIdleConns: 2
      connMaxLifetime: 14400

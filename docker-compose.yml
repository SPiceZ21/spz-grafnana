services:
  grafana:
    image: grafana/grafana:11.6.0
    container_name: spz-grafana
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      GF_SECURITY_ADMIN_USER: ${GF_SECURITY_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GF_SECURITY_ADMIN_PASSWORD:?Set GF_SECURITY_ADMIN_PASSWORD in .env}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_SERVER_HTTP_ADDR: 0.0.0.0
      GF_SERVER_HTTP_PORT: 3000
      SPZ_DB_HOST: ${SPZ_DB_HOST:?Set SPZ_DB_HOST in .env}
      SPZ_DB_NAME: ${SPZ_DB_NAME:?Set SPZ_DB_NAME in .env}
      SPZ_DB_USER: ${SPZ_DB_USER:?Set SPZ_DB_USER in .env}
      SPZ_DB_PASSWORD: ${SPZ_DB_PASSWORD:?Set SPZ_DB_PASSWORD in .env}
    volumes:
      - grafana-data:/var/lib/grafana
      - ./provisioning:/etc/grafana/provisioning:ro

volumes:
  grafana-data:

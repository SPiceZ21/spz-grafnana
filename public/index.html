<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <title>SPZ Track Map Explorer</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="">
  <style>
    :root{color-scheme:dark;--bg:#0b0d12;--panel:#141821;--line:#272e3a;--muted:#9aa4b2;--orange:#ff6b26;--text:#eef2f7}
    *{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:14px Inter,Segoe UI,sans-serif}
    header{height:74px;display:flex;align-items:center;gap:16px;padding:0 22px;border-bottom:1px solid var(--line);background:#10131a}
    .brand{font-weight:800;letter-spacing:.1em;color:var(--orange)}.title{font-size:17px;font-weight:700}.sub{color:var(--muted);font-size:12px;margin-top:3px}
    main{display:grid;grid-template-columns:310px 1fr;height:calc(100vh - 74px)}aside{padding:18px;border-right:1px solid var(--line);overflow:auto;background:#10131a}
    label{display:block;color:var(--muted);font-size:11px;text-transform:uppercase;letter-spacing:.1em;margin:12px 0 7px}
    input,select{width:100%;background:var(--panel);border:1px solid var(--line);color:var(--text);border-radius:7px;padding:10px}
    .stats{display:flex;gap:9px;margin:16px 0}.stat{flex:1;padding:12px;background:var(--panel);border:1px solid var(--line);border-radius:8px}.stat b{display:block;font-size:20px}.stat small{color:var(--muted)}
    #list{margin-top:12px;display:grid;gap:5px}.item{text-align:left;background:transparent;border:1px solid transparent;color:var(--text);padding:9px;border-radius:6px;cursor:pointer}.item:hover,.item.active{background:#1c222d;border-color:#333d4d}.item small{display:block;color:var(--muted);margin-top:3px}
    section{position:relative;min-width:0;min-height:0}#map{width:100%;height:100%;background:#10151b}.hud{position:absolute;z-index:500;top:16px;left:16px;background:#111722eF;border:1px solid var(--line);border-radius:8px;padding:12px 14px;pointer-events:none}.hud b{font-size:15px}.hud span{color:var(--muted);font-size:12px;display:block;margin-top:4px}.leaflet-control-layers,.leaflet-bar a{background:#141821!important;color:#eef2f7!important;border-color:#343b47!important}.leaflet-control-attribution{background:#111722cc!important;color:#bbc3ce!important}.leaflet-control-attribution a{color:#ff986b!important}.map-status{position:absolute;left:16px;bottom:16px;z-index:500;background:#111722dd;border:1px solid var(--line);border-radius:7px;padding:8px 10px;color:#bbc3ce;font-size:11px}
    @media(max-width:760px){main{grid-template-columns:1fr;height:auto;min-height:calc(100vh - 74px)}aside{border:0;border-bottom:1px solid var(--line)}section{height:60vh}}
  </style>
</head>
<body>
  <header><div class="brand">SPZ</div><div><div class="title">Track Map Explorer</div><div class="sub">GTA V map tiles with SPZ race routes</div></div></header>
  <main><aside>
    <div class="stats"><div class="stat"><b id="trackCount">—</b><small>Tracks</small></div><div class="stat"><b id="pointCount">—</b><small>Checkpoints</small></div></div>
    <label for="kind">Track type</label><select id="kind"><option value="all">All routes</option><option value="circuit">Circuits</option><option value="sprint">Sprints</option></select>
    <label for="search">Find track</label><input id="search" placeholder="Search by track name…">
    <label for="track">Selected route</label><select id="track"></select><div id="list"></div>
  </aside><section><div id="map" role="application" aria-label="GTA V map with SPZ race route overlays"></div><div class="hud"><b id="routeName">Loading SPZ routes…</b><span id="routeInfo">GTA V map tiles · scroll to zoom · drag to pan</span></div><div class="map-status" id="mapStatus">Loading map tiles…</div></section></main>
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
  <script>
    const select=document.querySelector('#track'),kind=document.querySelector('#kind'),search=document.querySelector('#search');
    const map=L.map('map',{zoomControl:true,preferCanvas:true,worldCopyJump:false,minZoom:0,maxZoom:8,zoomSnap:.25});
    const gameTiles=L.tileLayer('https://s.rsg.sc/sc/images/games/GTAV/map/game/{z}/{x}/{y}.jpg',{minZoom:0,maxZoom:8,maxNativeZoom:5,noWrap:true,attribution:'Map tiles © Rockstar Games'}).addTo(map);
    const blank=L.layerGroup();L.control.layers({'GTA V map':gameTiles,'Plain map':blank},null,{position:'topright',collapsed:true}).addTo(map);
    const routePane=map.createPane('routes');routePane.style.zIndex=420;routePane.style.pointerEvents='auto';
    let tracks=[],layers=[],selected=null;
    const bands=[
      {y:(x,y)=>y < -1000,lon:[-3.03663255576895e-9,.0200175350440883,-97.211789757094],lat:[6.23122700084464e-14,4.20129073856139e-10,2.33168021020044e-6,.0240131069198339,14.1346597090657]},
      {y:(x,y)=>y < 2000,lon:[2.04927570146569e-8,.0199382651698616,-97.2328189248356],lat:[-5.48114969721267e-14,-1.7644651413213e-10,-6.69398961485353e-7,.019446455419011,11.948776738614]},
      {y:(x,y)=>y < 5000,lon:[1.14491978248603e-8,.0199665146367798,-97.2865999889282],lat:[-7.50970630545523e-15,2.42587620752238e-10,-3.39800162545523e-6,.02514652658967,7.49474095495398]},
      {y:()=>true,lon:[-4.51344244634536e-8,.0200135106227036,-97.1355799536373],lat:[-2.33545837309061e-14,6.7194107532233e-10,-7.73181068541832e-6,.0443322941450463,-23.9182574396233]}
    ];
    function gameToMap(x,y){const b=bands.find(v=>v.y(x,y));const [a,b1,c]=b.lon,[a4,a3,a2,d,e]=b.lat;const longitude=a*x*x+b1*x+c,latitude=a4*y**4+a3*y**3+a2*y*y+d*y+e;return [latitude,longitude]}
    function filtered(){return tracks.filter(t=>(kind.value==='all'||t.type===kind.value)&&t.name.toLowerCase().includes(search.value.toLowerCase()));}
    function renderList(){const rows=filtered();select.innerHTML='<option value="">All routes overview</option>'+rows.map(t=>`<option value="${t.id}">${t.name} · ${t.type}</option>`).join('');if(selected&&!rows.some(t=>t.id===selected.id))selected=null;select.value=selected?.id||'';document.querySelector('#list').innerHTML=rows.slice(0,60).map(t=>`<button class="item ${selected?.id===t.id?'active':''}" data-id="${t.id}">${t.name}<small>${t.type} · ${t.points.length} checkpoints · ${t.laps} lap${t.laps===1?'':'s'}</small></button>`).join('');document.querySelectorAll('.item').forEach(b=>b.onclick=()=>choose(b.dataset.id));}
    function clearLayers(){layers.forEach(l=>map.removeLayer(l));layers=[]}
    function drawRoutes(){clearLayers();const visible=selected?[selected]:tracks.filter(t=>kind.value==='all'||t.type===kind.value);for(const t of visible){const points=t.points.map(p=>gameToMap(p[0],p[1]));if(points.length<2)continue;const color=t.type==='sprint'?'#4dd4ff':'#ff712e';const line=L.polyline(points,{pane:'routes',color,weight:selected?4:2,opacity:selected?.96:.58,lineCap:'round',lineJoin:'round'}).addTo(map);line.bindTooltip(`${t.name} · ${t.type} · ${t.points.length} checkpoints`,{sticky:true});line.on('click',()=>choose(t.id));layers.push(line);if(selected){const start=L.circleMarker(points[0],{pane:'routes',radius:7,color:'#fff',weight:2,fillColor:'#fff',fillOpacity:1}).addTo(map).bindTooltip(`${t.name} · Start`);const finish=L.circleMarker(points[points.length-1],{pane:'routes',radius:6,color:'#fff',weight:2,fillColor:color,fillOpacity:1}).addTo(map).bindTooltip(`${t.name} · Finish`);layers.push(start,finish)}}}
    function fitRoutes(){const visible=selected?[selected]:tracks.filter(t=>kind.value==='all'||t.type===kind.value);const pts=visible.flatMap(t=>t.points.map(p=>gameToMap(p[0],p[1])));if(pts.length)map.fitBounds(L.latLngBounds(pts).pad(.12),{animate:false,maxZoom:selected?5:3});}
    function choose(id){selected=tracks.find(t=>t.id===id)||null;select.value=selected?.id||'';document.querySelector('#routeName').textContent=selected?.name||'All SPZ routes';document.querySelector('#routeInfo').textContent=selected?`${selected.type.toUpperCase()} · ${selected.points.length} checkpoints · ${selected.laps} lap${selected.laps===1?'':'s'} · GTA V map tiles`:'Showing all routes · GTA V map tiles';renderList();drawRoutes();fitRoutes();}
    fetch('tracks.json').then(r=>r.json()).then(data=>{tracks=data.tracks;document.querySelector('#trackCount').textContent=tracks.length;document.querySelector('#pointCount').textContent=tracks.reduce((n,t)=>n+t.points.length,0).toLocaleString();renderList();selected=tracks[0]||null;choose(selected?.id||'');document.querySelector('#mapStatus').textContent='Rockstar GTA V map tiles';}).catch(()=>{document.querySelector('#routeInfo').textContent='Could not load tracks.json — run tools/export_tracks.py';document.querySelector('#mapStatus').textContent='Track data unavailable';});
    gameTiles.on('tileerror',()=>{document.querySelector('#mapStatus').textContent='Some map tiles could not load';});gameTiles.on('tileload',()=>{document.querySelector('#mapStatus').textContent='Rockstar GTA V map tiles';});
    select.onchange=()=>choose(select.value);kind.onchange=()=>{renderList();drawRoutes();fitRoutes()};search.oninput=renderList;map.on('baselayerchange',e=>{document.querySelector('#mapStatus').textContent=e.layer===gameTiles?'Rockstar GTA V map tiles':'Plain map'});
  </script>
</body>
</html>
